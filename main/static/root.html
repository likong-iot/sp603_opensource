  <script>
    const passwordInput = document.getElementById('password');
    const eyeOpen = document.getElementById('eyeOpen');
    const eyeClosed = document.getElementById('eyeClosed');
    const loginButton = document.getElementById('loginButton');
    const loginForm = document.getElementById('login');
    const loginres = document.getElementById('loginres');

    const togglePasswordVisibility = () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeOpen.style.display = isPassword ? 'block' : 'none';
      eyeClosed.style.display = isPassword ? 'none' : 'block';
    };

    const fetchData = async (event) => {
      event.preventDefault(); // 阻止默认提交行为
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        });

        if (response.ok) {
          const data = await response.text();
          console.log('Login response:', data);
          if (data === "success") {
            // 只有成功时才跳转
            window.location.href = '/status';
          } else {
            loginres.textContent = '登录失败, 请检查用户名和密码';
            loginres.style.color = "red";
            loginres.style.textAlign = "center";
            loginres.style.marginTop = "6px";
          }
        } else {
          console.error('Error fetching data. Status:', response.status);
          loginres.textContent = response.status === 401
            ? '登录失败, 请检查用户名和密码'
            : '网络错误, 请稍后重试';
          loginres.style.color = "red";
          loginres.style.textAlign = "center";
          loginres.style.marginTop = "6px";
        }
      } catch (error) {
        console.error('Login error:', error);
        loginres.textContent = '登录请求失败, 请检查网络连接';
        loginres.style.color = "red";
        loginres.style.textAlign = "center";
        loginres.style.marginTop = "6px";
      }
    };

    eyeOpen.addEventListener('click', togglePasswordVisibility);
    eyeClosed.addEventListener('click', togglePasswordVisibility);
    loginForm.addEventListener('submit', fetchData);
  </script>
